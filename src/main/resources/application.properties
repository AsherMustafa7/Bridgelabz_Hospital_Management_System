
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=hospital-management-system

server.port=8081


# ==========================================
# DATABASE CONFIGURATION - MYSQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO

logging.level.com.asher.hospitalmanagement=DEBUG

logging.level.org.springframework.security=INFO

logging.file.name=logs/hospital-management.log


# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}